name: tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:
  
permissions:
  contents: read
  pull-requests: write

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowchunk
          POSTGRES_PASSWORD: flowchunk
          POSTGRES_DB: flowchunk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowchunk -d flowchunk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://flowchunk:flowchunk@localhost:5432/flowchunk
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          python - <<'PY'
          import os
          import time

          import psycopg2

          dsn = os.environ["DATABASE_URL"]
          for _ in range(30):
              try:
                  connection = psycopg2.connect(dsn)
                  connection.close()
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("Postgres did not become ready in time")
          PY

      - name: Run migrations
        run: alembic upgrade head

      - name: Run lint
        run: |
          ruff check .

      - name: Check formatting
        run: |
          ruff format --check .

      - name: Run tests
        run: python -m pytest
