services:
  postgres:
    image: postgres:16

    container_name: flowchunk-db

    restart: always

    environment:
      POSTGRES_USER: flowchunk
      POSTGRES_PASSWORD: flowchunk
      POSTGRES_DB: flowchunk

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    
volumes:
  postgres_data: